name: Build Acode 1.13.5 Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Install dependencies and configure Cordova
        run: npm run setup

      - name: Prepare Acode storage
        run: node utils/storage_manager.mjs y

      - name: Build production APK
        run: npm run build paid prod apk

      - name: Verify generated APK
        run: |
          echo "Generated APK files:"
          find platforms/android -type f -name "*.apk" -print

      - name: Calculate APK SHA-256
        run: |
          sha256sum platforms/android/app/build/outputs/apk/release/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: acode-1.13.5-release-apk
          path: platforms/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
