name: Build Acode Release APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Cordova CLI globally
        run: npm install -g cordova

      - name: Install project dependencies
        run: npm ci

      - name: Build web assets for production
        run: |
          npm run build:release || npm run build

      - name: Add Android platform
        run: cordova platform add android --no-telemetry

      - name: Generate release signing keystore and build config
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias acode_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass password123 \
            -keypass password123 \
            -dname "CN=Acode, OU=Acode, O=Acode, L=Unknown, ST=Unknown, C=US"

          cat <<EOF > build.json
          {
            "android": {
              "release": {
                "keystore": "release.keystore",
                "storePassword": "password123",
                "alias": "acode_key",
                "password": "password123",
                "keystoreType": ""
              }
            }
          }
          EOF

      - name: Build signed release APK
        run: cordova build android --release --buildConfig=build.json --no-telemetry

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: acode-release-apk
          path: platforms/android/app/build/outputs/apk/release/*-release.apk
          retention-days: 7
